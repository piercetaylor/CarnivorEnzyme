  # ============================================================
  # 4. NEPENTHESINS — MOVED to methods_benchmark 2026-08-22
  # ============================================================
  # True Nepenthes nepenthesins (merops: A01.040) were split out of the former combined
  # "nepenthesins" entry on 2026-08-22 (see aspartic_proteases_a1b_homology below for the
  # other half of that split), then moved a second time, same day, out of tier1 entirely:
  # because all Nepenthes species share ONE carnivory_origin (Caryophyllales carnivory is
  # a single shared origin per Fleck & Jobson 2023 / Fleischmann et al. 2018 — see
  # audit/02_carnivory_origin_reassignment.md), a Nepenthes-only family can never supply
  # substitutions from >=2 independent origins, so it is mathematically incapable of
  # producing a cross-lineage convergence result under min_lineages=2. It is retained
  # under methods_benchmark: (below the methods_benchmark: key, alongside neprosins) as a
  # within-Nepenthes structural/stability case study, not a Tier-1 convergence family.
  # See audit/03_merops_restructure_and_neprosin_rescope.md for full reasoning and sources.

  # ============================================================
  # 4B. ASPARTIC PROTEASES, A1B-LIKE BY HOMOLOGY (droserasin, dionain-AP, Cephalotus AP,
  #     Sarracenia AP) — NO independent MEROPS holotype
  # ============================================================
  # RESTRUCTURED 2026-08-22 (audit/03_merops_restructure_and_neprosin_rescope.md):
  #   Split out of the former single "nepenthesins" entry (see section 4 above for the
  #   full rationale). These sequences are A1B-like by homology / domain architecture
  #   (presence of the plant-specific insert, PSI) but MEROPS itself lists no holotype
  #   for droserasin, dionain, Cephalotus AP, or Sarracenia AP — verified directly by
  #   fetching MEROPS family A1's full holotype/peptidase-and-homologues listing
  #   (ebi.ac.uk/merops/cgi-bin/famsum?family=A1), which contains exactly one carnivorous-
  #   plant holotype (A01.040, nepenthesin). Butts et al. 2016 (Proteins 84:1517)
  #   describes droserasins only as "classified as belonging to the MEROPS A1 class,
  #   which also includes pepsin and the nepenthesins" — a homology/family-level
  #   statement, not a holotype-sharing claim.
  # No merops holotype code — see note field below.
  # Key literature:
  #   - Butts et al. 2016, Proteins — droserasin structure prediction; PSI confirmed
  #     (100-residue plant-specific insert; CORRECTED 2026-08-22 — this PSI-length figure
  #     is from Sprague-Piercy et al. 2020, Biomolecules 10:1069, DOI 10.3390/biom10071069,
  #     not "Butts et al. 2020" as an earlier pass of this file mistakenly attributed it)
  #   - Fukushima et al. 2017 — Cephalotus AP included in original convergence analysis

  aspartic_proteases_a1b_homology:
    merops: null
    experimental_pdb: null          # No experimental structure for any A1B-homology member
    subfamily: "A1B-like by homology only (Butts et al. 2016); no MEROPS holotype"
    note: "A1B-like by homology only (Butts et al. 2016); no MEROPS holotype — verified directly against MEROPS 2026-08-22, see audit/03_merops_restructure_and_neprosin_rescope.md. Spans 3 independent carnivory_origin values under current config/species.yaml numbering (Drosera+Dionaea=origin 1, Cephalotus=origin 2, Sarracenia=origin 3) — confirmed >= min_lineages(2), remains a valid tier1 cross-lineage convergence target on its own even without the Nepenthes-only nepenthesins entry (moved to methods_benchmark 2026-08-22)."
    convergent_source: "Fukushima et al. 2017 (Cephalotus AP explicitly included); valid standalone cross-lineage convergence target (Drosera/Dionaea origin 1, Cephalotus origin 2, Sarracenia origin 3); combine with methods_benchmark.nepenthesins only if a manual Fukushima et al. 2017-style combined A1B analysis is needed downstream"
    expected_length_aa: [280, 650]  # Wide range: dionains ~300 aa, phytepsins up to ~510 aa,
                                    # Cephalotus AP 612 aa
    accessions:

      # --- Drosera (droserasins) ---
      Drosera_capensis:
        - KAL9267547.1  # GENOME: Aspartic proteinase nepenthesin-1-like, 440 aa; D. capensis WGS
        - KAL9250295.1  # GENOME: Aspartic proteinase nepenthesin-1-like, 449 aa; D. capensis WGS
                        # These are the best available droserasin-type A1B entries (Butts 2016
                        # LIEC locus IDs differ from KAL numbering; BLAST verification recommended).
                        # KAL9250314.1 removed — annotated as "guard-cell AP 1-like" which is
                        # likely a non-digestive isoform (stomatal function, not secretome).
                        # Additional candidates: KAL9267546.1 (435 aa), KAL9265331.1 (440 aa),
                        # KAL9261082.1 (435 aa) — include if BLAST confirms droserasin identity.

      Drosera_rotundifolia:
        - GAB2239788.1  # GENOME: hypothetical protein Droror1_Dr00020306, 432 aa
                        # Returned by aspartic protease Entrez search (280-660 aa filter).
                        # CAUTION: annotated "hypothetical protein" — verify A1B subfamily
                        # (PLN03146 / eukaryotic aspartyl protease) via CDD before running.

      Drosera_spatulata:
        - TODO          # NOT FOUND: Entrez search returned no A1B aspartic protease for this taxon.

      # --- Dionaea (dionain — aspartic protease isoforms; NOT the Tier 2 cysteine-protease
      #     dionain-2/dionain-4, APM86431.1/APM86430.1, which are a distinct C1 papain-like family) ---
      Dionaea_muscipula:
        - A0A0E3GLN3    # VERIFIED UniProt: Dionain-1, aspartic protease, 352 aa; Palfalvi 2020
                        # NOTE: 352 aa is shorter than canonical nepenthesins (437 aa) — may be
                        # partial prediction from the tetraploid Dionaea genome assembly.
        - A0A0E3M338    # VERIFIED UniProt: Dionain-3, aspartic protease, 300 aa; Palfalvi 2020
                        # NOTE: 300 aa is at the lower edge of expected range [280, 650].
                        # Very likely a partial/truncated gene model. Flag for length filter in pipeline.

      # NOTE: Aldrovanda vesiculosa A1B aspartic protease — REMOVED (April 2026)
      # PRJNA918534 is organellar-genome only; no nuclear aspartic protease in NCBI.
      # Expected droserasin/dionain-like sequences given sister relationship to Dionaea
      # but Palfalvi 2020 nuclear genome was not submitted to NCBI Protein. Confirmed absent.

      # --- Cephalotus ---
      Cephalotus_follicularis:
        - GAV73214.1    # GENOME VERIFIED: Asp + SapB_2 + SapB_1 domain protein, 517 aa (Fukushima 2017 genome)
                        # SapB_1 + SapB_2 ARE the Plant-Specific Insert (PSI) — A1B confirmed.
                        # Cephalotus AP was included in Fukushima 2017 convergence analysis.
        - GAV73783.1    # GENOME VERIFIED: Asp + SapB_2 + SapB_1 domain protein, 508 aa (second isoform)
                        # REMOVED: GAV28673.1 was Pichia membranifaciens (yeast contamination in NCBI)
                        # REMOVED: GAV69561.1 was UDP-glucuronosyltransferase, not AP

      # --- Sarraceniaceae (Ericales — origin 5) ---
      Sarracenia_purpurea:
        - BAW35441.1    # VERIFIED: Aspartic protease, 485 aa [Sarracenia purpurea subsp. venosa]
                        # Directly characterized; correct size for A1B subfamily.
                        # Verify PSI insert presence before including in A1B alignment.

      Darlingtonia_californica:
        - TODO          # NOT FOUND in NCBI protein search

      Heliamphora_ciliata:
        - TODO          # NOT FOUND in NCBI protein search

      # --- Lentibulariaceae (Lamiales — origin 6) ---
      Utricularia_gibba:
        - TODO          # CONFIRMED NOT IN NCBI/UNIPROT: Only plastid proteins for U. gibba.
                        # Utricularia has a highly reduced genome (~82 Mb); A1B AP family
                        # may have been lost. Lan 2017 gene models are in JGI format only.
                        # ACTION: Search Lan 2017 gene models for eukaryotic aspartyl protease domain.

      Pinguicula_moranensis:
        - TODO          # NOT FOUND in NCBI protein search

      # --- Outgroups (plant aspartic proteases, A1 family) ---
      # Duplicated from nepenthesins above: both split families need the same A1B/A1
      # outgroups for phylogenetic rooting. See audit doc for rationale.
      Arabidopsis_thaliana:
        - NP_187876.2   # OUTGROUP VERIFIED: Eukaryotic aspartyl protease family, 461 aa
        - NP_565911.1   # OUTGROUP VERIFIED: Eukaryotic aspartyl protease family, 442 aa

      Solanum_lycopersicum:
        - XP_004253208.1 # OUTGROUP VERIFIED: ASPARTIC PROTEASE IN GUARD CELL 2, 486 aa
        - XP_019070220.2 # OUTGROUP VERIFIED: ASPARTIC PROTEASE IN GUARD CELL 1-like, 455 aa

      Hordeum_vulgare:
        - P42210        # OUTGROUP VERIFIED: HvPhytepsin (ASPR_HORVU), 508 aa — A1B phytepsin
                        # UniProt Swiss-Prot; well-characterized barley vacuolar A1B aspartic protease
                        # M0W9B2 (HvNEP-1) was inaccessible (empty UniProt response, accession obsolete)
                        # P42210 is the best available barley A1B outgroup
        - XP_045019345.1 # OUTGROUP: Hordeum nucellin-like (no PSI insert), 393 aa
                        # Useful as structural contrast: nucellin lacks the PSI domain of nepenthesins

      Triticum_dicoccoides:
        - XP_037427783.1 # OUTGROUP VERIFIED: aspartic proteinase nepenthesin-2-like, 469 aa
                        # Triticum dicoccoides (emmer wheat, T. aestivum progenitor) — not T. aestivum.
                        # Annotation "nepenthesin-2-like" confirms A1B subfamily.

      Vitis_vinifera:
        - XP_019076990.1 # OUTGROUP VERIFIED: probable aspartyl protease At4g16563-like, 458 aa
                        # Replaces XP_002267025.1 (WRONG — that accession is phosphatidylinositol
                        # 4-kinase gamma 5, completely wrong enzyme).


