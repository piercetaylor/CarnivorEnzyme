# ============================================================
# METHODS BENCHMARK / WITHIN-LINEAGE CASE STUDY FAMILIES
# ============================================================
# RE-SCOPED 2026-08-22 (audit/03_merops_restructure_and_neprosin_rescope.md):
#   Neprosins moved here from tier1. Neprosin (DUF239 / MEROPS U74 family) has zero
#   orthologs outside Nepenthes — independently re-confirmed this session (WebSearch/
#   WebFetch of Ting et al. 2022 and a 2018 PeerJ digestive-enzyme review; no neprosin
#   reported in Drosera, Dionaea, Cephalotus, Sarracenia, Utricularia, Pinguicula, or
#   Byblis). This was already established in ORTHOLOGY_AND_FAMILY_SCOPE_2026-05-12.md
#   Section 2. Because Snakefile derives FAMILIES = list(data["tier1"].keys()) (see
#   Snakefile lines 44-49), removing "neprosins" from tier1 simply drops it from the
#   per-family expand() targets in phase2/phase3a/phase4a/phase5d and rule `all` — this
#   is the intended effect (no cross-lineage convergence run on a single-origin family).
#   Confirmed no rule in workflow/rules/*.smk hardcodes "neprosins" or reads FAMILIES
#   independently of Snakefile (grepped workflow/rules — no FAMILIES/tier1 references
#   found there). One dangling reference found and left as-is (out of this task's
#   explicit scope): config/config.yaml fep.substrates_for_fep still has a "neprosins:"
#   key; harmless today since workflow/scripts/run_fep.py does not yet exist (not yet
#   built per CLAUDE.md Phase 5D), but flagged for whoever builds run_fep.py — it will
#   also need a substrate entry for the new "aspartic_proteases_a1b_homology" key if
#   FEP is ever run on that family.
#   Retained here as: (1) AF3/Chai-1 structure-prediction validation benchmark (PDB
#   7ZVA/7ZVB/7ZVC/7ZU8 — the only experimental structure for any carnivorous plant
#   digestive enzyme); (2) within-Nepenthes case study (pitcher-pH vs neprosin
#   substitution comparison across N. gracilis/alata/ampullaria/ventrata/mirabilis).

methods_benchmark:

  # ============================================================
  # GH19 CHITINASES — CLASS I (structural comparison only, NOT a convergence target)
  # ============================================================
  # MOVED HERE from tier1 2026-08-24 (audit/10_config_gaps_and_consistency_test.md): all 3
  # species in this family (Drosera_capensis, Drosera_adelae, Drosera_binata) share
  # carnivory_origin: 1 (Caryophyllales — see config/species.yaml), so this family can
  # never satisfy convergence.min_lineages: 2 and was producing a guaranteed header-only
  # empty convergence-detection output every run under tier1:. Same rationale/treatment as
  # nepenthesins/neprosins (moved out of tier1 2026-08-22, see below and
  # audit/03_merops_restructure_and_neprosin_rescope.md). See the "1B. GH19 CHITINASES —
  # CLASS I — MOVED" placeholder comment left in tier1's former section 1B for the
  # cross-reference. Moved verbatim — no comments, accessions, or notes were dropped.
  #
  # RESTRUCTURED 2026-08-22 (audit/04_gh19_class_split.md): split out of the former single
  # "chitinases_gh19" entry (see tier1 section 1 for full rationale). These sequences have
  # an intact Chitin_bind_1/CBM18 chitin-binding domain (verified: Yoneda et al. 2025 FEBS
  # Open Bio 15:1930-1944 for D. adelae BAW35424.1; Planta 2025 PMC11725546 for D. binata
  # QHN63861.1) — different domain architecture from the Class IV target class in
  # tier1.chitinases_gh19_class_iv. Do NOT combine with chitinases_gh19_class_iv in a
  # single alignment/tree for cross-lineage convergence detection; use only for structural
  # comparison (e.g. against the D. adelae PDB 9JTR crystal structure).

  chitinases_gh19_class_i:
    cazy: GH19
    merops: null
    class: "I"
    note: "Structural comparison only — not used for cross-lineage convergence detection (different domain architecture: intact Chitin_bind_1/CBM18 domain, vs. the truncated/deleted CBM18 of the chitinases_gh19_class_iv target class). See audit/04_gh19_class_split.md. MOVED from tier1 to methods_benchmark 2026-08-24 — see audit/10_config_gaps_and_consistency_test.md — because all 3 species share a single carnivory_origin and the family can never meet min_lineages: 2."
    convergent_source: "Not applicable — Class I chitinases; not a Fukushima et al. 2017 Fig. 3a convergence target (that target class is Class IV, see tier1.chitinases_gh19_class_iv)"
    expected_length_aa: [300, 330]
    accessions:

      # --- Drosera (Caryophyllales, sticky trap) ---
      Drosera_capensis:
        - BDB33378.1    # VERIFIED: Class I chitinase, 325 aa. MOVED here 2026-08-22 from
                        # chitinases_gh19_class_iv, where it was previously mislabeled as a
                        # Class IV "proxy" — it is genuinely Class I (different domain
                        # architecture) and useful here for structural comparison, but is NOT
                        # the D. capensis Class IV ortholog. See the TODO under
                        # chitinases_gh19_class_iv's Drosera_capensis entry for the actual
                        # (unresolved) Class IV gap.

      Drosera_adelae:
        - BAW35424.1    # VERIFIED: Basic chitinase (GH19 class I), 321 aa; Yoneda et al. 2025,
                        # FEBS Open Bio 15:1930-1944. Crystal structure deposited as PDB 9JTR (1.73 Å)
                        # Directly confirmed class I: "Sequence analysis of D. adelae chitinase has
                        # revealed that it belongs to class I of the GH19 family... A distinguishing
                        # feature of class I chitinases is the presence of a chitin-binding domain,
                        # also known as the hevein domain, at their N-terminal region" (Yoneda et al. 2025).

      Drosera_binata:
        - QHN63861.1    # VERIFIED: Endochitinase class I (DbChitI-3), 321 aa; MN481117.1
                        # Libantova et al. 2019 submission; pH optimum 2.5 (Planta 2025, PMC11725546)
                        # GH19 confirmed (Glyco_hydro_19 + Chitin_bind_1 domains). Class I annotation
                        # independently confirmed in Planta 2025 (PMC11725546), which describes it as
                        # an "extracellular class I chitinase."

  # ============================================================
  # NEPENTHESINS (Aspartic proteases, A1B) — Nepenthes-only, MEROPS holotype family
  # ============================================================
  # Moved here from tier1 2026-08-22 — see the "4. NEPENTHESINS — MOVED" comment left in
  # tier1's former section 4 for the full cross-reference, and
  # audit/03_merops_restructure_and_neprosin_rescope.md for sources/reasoning.
  # Primary digestive proteases of carnivorous plants.
  # Merops holotype: A01.040 (nepenthesin, Nepenthes gracilis) — verified directly against
  #   MEROPS (ebi.ac.uk/merops/cgi-bin/famsum?family=A1 and pepsum?id=A01.040), 2026-08-22.
  # No experimental structure for nepenthesins (Kadek 2016 crystallized but coords not deposited)
  # Key literature:
  #   - Athauda et al. 2004, Biochem J — nepenthesin I and II characterization
  #   - Takahashi et al. 2011, FEBS Lett — nepenthesin substrate specificity

  nepenthesins:
    merops: A01.040
    subfamily: A1B
    note: "PSI-confirmed, MEROPS holotype (Nepenthes gracilis); verified directly against MEROPS 2026-08-22 — see audit/03_merops_restructure_and_neprosin_rescope.md"
    experimental_pdb: null          # Kadek 2016 crystallized at 2.8Å but coords NOT deposited
    convergent_source: "Not applicable — Nepenthes-only, single carnivory_origin (see config/species.yaml); cannot produce cross-lineage convergence results under min_lineages=2. Retained as a within-Nepenthes structural/stability case study (FoldX, ESM-2, AF3) across N. gracilis/alata/mirabilis, not a Phase 2 convergence-detection target. Combine with aspartic_proteases_a1b_homology (tier1) if a manual Fukushima et al. 2017-style combined A1B cross-lineage analysis is ever needed downstream."
    expected_length_aa: [420, 450]  # Nepenthes nepenthesins cluster tightly ~437-442 aa
    accessions:

      # --- Nepenthes (canonical nepenthesins) ---
      Nepenthes_gracilis:
        - BAD07474.1    # VERIFIED: Nepenthesin I (Nep I), 437 aa; Athauda et al. 2004 ANCHOR
                        # Protein accession for AB114914 mRNA (elink nuccore→protein: 41016421)
        - BAD07475.1    # VERIFIED: Nepenthesin II (Nep II), 438 aa; Athauda et al. 2004 ANCHOR
                        # Protein accession for AB114915 mRNA
                        # NOTE: GMG99884.1 removed from here (kept only in neprosins — DUF239 family)

      Nepenthes_alata:
        - BBF98357.1    # VERIFIED: Nepenthesin III, 442 aa; Kadek et al. 2016
        - BAV14385.1    # VERIFIED: Nepenthesin II, 437 aa

      Nepenthes_mirabilis:
        - AFV26024.1    # VERIFIED: Nepenthesin 1, 437 aa; Takahashi et al. 2011
        - AFV26025.1    # VERIFIED: Nepenthesin 2, 437 aa; Takahashi et al. 2011

      # --- Outgroups (plant aspartic proteases, A1 family) ---
      # Duplicated in tier1.aspartic_proteases_a1b_homology: both split families need
      # the same A1B/A1 outgroups for phylogenetic rooting. See audit doc for rationale.
      Arabidopsis_thaliana:
        - NP_187876.2   # OUTGROUP VERIFIED: Eukaryotic aspartyl protease family, 461 aa
        - NP_565911.1   # OUTGROUP VERIFIED: Eukaryotic aspartyl protease family, 442 aa

      Solanum_lycopersicum:
        - XP_004253208.1 # OUTGROUP VERIFIED: ASPARTIC PROTEASE IN GUARD CELL 2, 486 aa
        - XP_019070220.2 # OUTGROUP VERIFIED: ASPARTIC PROTEASE IN GUARD CELL 1-like, 455 aa

      Hordeum_vulgare:
        - P42210        # OUTGROUP VERIFIED: HvPhytepsin (ASPR_HORVU), 508 aa — A1B phytepsin
                        # UniProt Swiss-Prot; well-characterized barley vacuolar A1B aspartic protease
                        # M0W9B2 (HvNEP-1) was inaccessible (empty UniProt response, accession obsolete)
                        # P42210 is the best available barley A1B outgroup
        - XP_045019345.1 # OUTGROUP: Hordeum nucellin-like (no PSI insert), 393 aa
                        # Useful as structural contrast: nucellin lacks the PSI domain of nepenthesins
                        # NOTE: this "nucellin-like" annotation is independently consistent with the
                        # MEROPS A01.073 nucellin holotype (Oryza sativa) verified above — nucellin
                        # lacking PSI is the defining A1A/A1B boundary marker (Chen & Foolad 1997).

      Triticum_dicoccoides:
        - XP_037427783.1 # OUTGROUP VERIFIED: aspartic proteinase nepenthesin-2-like, 469 aa
                        # Triticum dicoccoides (emmer wheat, T. aestivum progenitor) — not T. aestivum.
                        # Annotation "nepenthesin-2-like" confirms A1B subfamily.

      Vitis_vinifera:
        - XP_019076990.1 # OUTGROUP VERIFIED: probable aspartyl protease At4g16563-like, 458 aa
                        # Replaces XP_002267025.1 (WRONG — that accession is phosphatidylinositol
                        # 4-kinase gamma 5, completely wrong enzyme).

  # ============================================================
  # NEPROSINS (Glutamic peptidases; MEROPS family U74, unknown catalytic type)
  # ============================================================
  # Unique to Nepenthes — not found in other carnivorous lineages
  # MEROPS code corrected 2026-08-22: verified directly against MEROPS
  # (ebi.ac.uk/merops/cgi-bin/pepsum?id=G03.001 and famsum?family=U74).
  #   - G03.001 is WRONG for neprosin: it is the holotype for "strawberry mottle virus
  #     glutamic peptidase" (a plant-virus RNA2 polyprotein protease, family G3) — a
  #     completely different organism/protein.
  #   - The correct, MEROPS-official current code for neprosin is U74.001, family U74
  #     ("unknown catalytic type"), holotype "neprosin (Nepenthes ventrata)", MEROPS
  #     accession MER0351045, family established 2017-01-06 (MEROPS release 11.0).
  #   - CORRECTED 2026-08-22 (opus checker, audit/03_merops_restructure_and_neprosin_rescope.md):
  #     the paper describing neprosin's catalytic mechanism is Ting TY, Baharin A, Ramzi AB,
  #     Ng CL, Goh HH (2022), Plant Physiology and Biochemistry 183:23-35 — NOT "Tiew & Goh
  #     2022" as an earlier pass of this file mistakenly cited (wrong author list, drawn from
  #     search-snippet reconstruction rather than the primary text). The PUBLISHED version of
  #     this paper states neprosin "founds a new glutamic peptidase family" — it does NOT
  #     itself claim MEROPS family "G3" membership; the "G3" wording appeared only in an
  #     earlier bioRxiv v1 preprint and was dropped by the authors before publication.
  #     Separately, Oda & Wlodawer 2023 (Biochemistry 62:672-694, MEROPS release 12.4) DOES
  #     discuss neprosin within family G3's structural section, based on shared β-sandwich
  #     glutamic-peptidase fold architecture — a real but narrower structural-similarity
  #     observation, distinct from a formal MEROPS family-membership claim. MEROPS itself
  #     still lists neprosin only under U74.
  # Experimental structures available: 7ZVA, 7ZVB, 7ZVC, 7ZU8
  # Substrate: proline-containing peptides (cleaves after Pro)
  # Biotech application: gluten/gliadin digestion (coeliac disease therapy)
  # Key literature:
  #   - Del Amo-Maestro et al. 2022, Nat. Commun. — crystal structures (PDB 7ZVA-C, 7ZU8)
  #   - Schräder et al. 2017, Mol Cell Proteomics — neprosin as prolyl endoprotease
  #   - Ting et al. 2022, Plant Physiol. Biochem. 183:23-35 — neprosin founds a new glutamic
  #     peptidase family (catalytic Glu-Glu dyad); does not itself claim "G3" (see note above)
  #   - Oda & Wlodawer 2023, Biochemistry 62:672-694 — notes neprosin's structural (not formal
  #     taxonomic) similarity to MEROPS family G3 architecture
  #   - Ting et al. 2026 — gluten detoxification with neprosin

  neprosins:
    merops: U74.001
    merops_family: U74
    merops_note: "MEROPS-official: family U74 (unknown catalytic type), holotype neprosin (Nepenthes ventrata), MER0351045. Neprosin's own describing paper (Ting et al. 2022, Plant Physiol. Biochem. 183:23-35) states it founds 'a new' glutamic peptidase family and does not itself claim MEROPS 'G3' membership; Oda & Wlodawer 2023 separately notes structural (not formal) similarity to G3. Verified directly against MEROPS 2026-08-22, see audit/03_merops_restructure_and_neprosin_rescope.md"
    subfamily: "Glutamic peptidase, MEROPS-official family U74 (unknown catalytic type); structurally related to family G3 by architecture (Oda & Wlodawer 2023), not a formal G3 member"
    experimental_pdb:
      - "7ZVA"    # Zymogen native, 1.80 Å — primary validation target
      - "7ZVB"    # Mature form, 2.35 Å
      - "7ZVC"    # Mature form (crystal form 2), 1.85 Å
      - "7ZU8"    # Zymogen + inhibitor Lu-Xo4, 2.05 Å
    convergent_source: "Not applicable — Nepenthes-specific family; retained as AF3/Chai-1 structure-prediction validation benchmark and within-Nepenthes pitcher-pH case study, not a cross-lineage convergence family (re-scoped out of tier1 2026-08-22)"
    expected_length_aa: [370, 470]
    notes: "Nepenthes-specific; no other carnivorous lineage has this family (independently re-confirmed 2026-08-22 via WebSearch of Ting et al. 2022 and a 2018 PeerJ carnivorous-plant protease review — no neprosin reported outside Nepenthes). Convergence analysis not applicable but structural comparison across Nepenthes species IS planned. Moved from tier1 to methods_benchmark 2026-08-22 (was already recommended in ORTHOLOGY_AND_FAMILY_SCOPE_2026-05-12.md but not yet applied to this file)."
    accessions:

      # --- Nepenthes gracilis (primary species) ---
      Nepenthes_gracilis:
        - GMG99884.1    # GENOME: Nepgr_001724, 467 aa (Saul 2023) — may be neprosin
        - GMH01265.1    # GENOME: Nepgr_003104, 445 aa (Saul 2023) — may be neprosin
                        # NOTE: Saul 2023 genome predicts ~8 neprosin paralogs; confirm annotation

      # --- Nepenthes ampullaria (high-pH pitcher, pH~5 — useful for pH comparison) ---
      Nepenthes_ampullaria:
        - ARA95696.1    # VERIFIED: Neprosin 2, 421 aa
        - ARA95695.1    # VERIFIED: Neprosin 1, 421 aa

      # --- Nepenthes ventrata (source of crystal structures) ---
      Nepenthes_ventrata:
