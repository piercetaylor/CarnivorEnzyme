# Species metadata for CarnivorEnzyme pipeline.
# Used by: retrieve.smk, orthology.smk, convergence.smk, expression.smk
#
# Fields:
#   code:           short identifier used as wildcard in Snakemake rules and filenames
#   taxid:          NCBI taxonomy ID
#   genome:         NCBI assembly accession or BioProject ("transcriptome_only", "none")
#   pitcher_pH:     measured or estimated fluid pH (null = not applicable or unknown)
#   clade/order:    angiosperm order
#   trap:           trap morphology
#   carnivory_origin: integer grouping independent origins (1=Caryophyllales, 2=Oxalidales, etc.; see CARNIVORY ORIGINS block below)
#   expression_sra: SRA BioProject accession for RNA-seq (null if not used)
#   genome_source:  citation for genome assembly
#   tier:           1=core pipeline, 2=extended atlas
#
# CARNIVORY ORIGINS (independent evolutionary events):
#   Corrected 2026-08-22 (audit/02_carnivory_origin_reassignment.md). Previously this
#   header said "1 — Caryophyllales" (a single origin) while the per-species
#   carnivory_origin fields below actually encoded THREE separate Caryophyllales
#   origins (Nepenthes=1, Drosera=2, Dionaea/Aldrovanda=3) — an internal
#   contradiction. Verified against Fleck & Jobson (2023, Plants 12(19):3356,
#   https://doi.org/10.3390/plants12193356): "Within the Caryophyllales, carnivory
#   may have evolved once, only to be subsequently lost once or multiple times
#   during the divergence that led to the flypaper-trapping monotypic family
#   Drosophyllaceae, as well as Ancistrocladaceae + Dioncophyllaceae," with
#   Nepenthaceae and Droseraceae described as sister clades from that single
#   common carnivorous ancestor. Corroborated by Fleischmann et al. (2018,
#   in Ellison & Adamec eds., Carnivorous Plants: Physiology, Ecology, and
#   Evolution, Oxford University Press, ch. 3, doi:10.1093/oso/9780198779841.003.0003),
#   §3.2, quoted verbatim from the primary text: "In Nepenthales, carnivory appears
#   to have evolved only once ... The carnivorous lineage ('carnivorous Nepenthales:'
#   Droseraceae, Nepenthaceae, Drosophyllaceae, Dioncophyllaceae, Ancistrocladaceae)
#   is sister to an entirely noncarnivorous clade." The same chapter states
#   "Nepenthales were treated by APG IV (2016) as the non-core group of
#   Caryophyllales," so its "Nepenthales" is exactly the clade Fleck & Jobson
#   discuss as "within the Caryophyllales" — the two sources are commensurable and
#   agree on a single origin. Fleischmann et al. further state: "Molecular data
#   indicate unequivocally that Dionaea and Aldrovanda are sister to each other, and
#   jointly sister to Drosera; these three genera of Droseraceae ... in turn, are
#   sister to Nepenthes (Nepenthaceae)" — directly supporting one shared origin for
#   all four genera represented below. All Caryophyllales carnivorous species below
#   therefore share ONE carnivory_origin value.
#
#   CITATION CORRECTION (opus checker, 2026-08-22): an earlier revision of this
#   header attributed to Fleischmann et al. (2018) the phrase "once (or twice) in
#   the non-core Caryophyllales (i.e., Nepenthales)". That phrase does NOT appear in
#   the chapter. The chapter's only "or twice" hedge concerns ERICALES ("whether
#   carnivory arose once or twice in Ericales ... Sarraceniaceae and Roridula"), not
#   Caryophyllales. Its Caryophyllales statement is unhedged ("only once"). The
#   misquote has been replaced above with directly-verified primary text.
#
#   1 — Caryophyllales: Nepenthes, Drosera, Dionaea, Aldrovanda (single shared
#       origin; Drosophyllum not yet present as a species entry in this file)
#   2 — Oxalidales: Cephalotus
#   3 — Ericales: Sarracenia, Darlingtonia, Heliamphora (Sarraceniaceae family)
#   4 — Lamiales: Utricularia, Genlisea, Pinguicula (Lentibulariaceae)
#   5 — Lamiales: Byblis (Byblidaceae; distinct from Lentibulariaceae)
#   NOTE: Roridula (Ericales, Roridulaceae) excluded — lacks endogenous digestive enzymes

# ============================================================
# TIER 1: CORE PIPELINE SPECIES
# ============================================================

