    clade: Caryophyllales
    order: Caryophyllales
    trap: snap_trap
    # carnivory_origin shared with Nepenthes/Drosera/Aldrovanda: Dionaea is nested
    # within Droseraceae, which is sister to Nepenthaceae under a single common
    # carnivorous ancestor per Fleck & Jobson 2023 (Plants 12:3356) and
    # Fleischmann et al. 2018 (Ch. 3 in Ellison & Adamec eds.) — see header note.
    carnivory_origin: 1
    expression_sra: PRJEB12493     # Bemm et al. 2016
    genome_source: "Palfalvi et al. 2020, Genome Research"
    tier: 1

  # --- Aldrovanda (Caryophyllales, aquatic snap trap) ---
  Aldrovanda_vesiculosa:
    taxid: 3558
    code: Aves
    genome: PRJNA918534            # BioProject; Adamec et al. 2023; 20% TE content
    pitcher_pH: null
    clade: Caryophyllales
    order: Caryophyllales
    trap: snap_trap
    # carnivory_origin shared with Nepenthes/Drosera/Dionaea: Aldrovanda is nested
    # within Droseraceae (sister to Dionaea), which is sister to Nepenthaceae under
    # a single common carnivorous ancestor per Fleck & Jobson 2023 and Fleischmann
    # et al. 2018 — see header note. Previously coded as a separate origin (3) from
    # Nepenthes(1)/Drosera(2); that split is not supported by the retrieved literature.
    carnivory_origin: 1
    expression_sra: null
